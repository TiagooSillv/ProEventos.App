<div class="row mt-4">
 
	<div class="col-md-6 d-none d-md-block" style="height: 450px;">
		<div class="text-center col-md-12 my-auto side-heder">
			<h1>Cadastro de Usuário</h1>
			<img src="registerImage.png" class="my-4" alt="" width="400px">
		</div>
	</div>
 
	<div class="col-md-6">
    <form [formGroup]="form" class="p-1">
        <div class="pb-2 d-block d-md-none">
            <h3 class="border-bottom">Cadastro de Usuário</h3>
        </div>
        <div class="row">
            <div class="col-sm-6 mb-3">
                <label>Primeiro Nome</label>
                <input
                    type="text"
                    class="form-control"
                    formControlName="nome"
                    placeholder="Insira o Primeiro nome"
                    [ngClass]="{'is-invalid': f.nome?.errors && f.nome?.touched}"
                />
                <div *ngIf="f.nome?.errors?.required && f.nome?.touched" class="invalid-feedback">
                    Nome é obrigatório!
                </div>
                <div *ngIf="f.nome?.errors?.minlength && f.nome?.touched" class="invalid-feedback">
                    O nome deve ter no mínimo 3 caracteres.
                </div>
            </div>
            
            <div class="col-sm-6 mb-3">
                <label>Último nome</label>
                <input
                 type="text" 
                 class="form-control" 
                 formControlName="sobreNome"
                 placeholder="Insira o Último nome"
                 [ngClass]="{'is-invalid': f.sobreNome?.errors && f.sobreNome?.touched}"
                 />  
                 <div *ngIf="f.sobreNome?.errors?.required && f.sobreNome?.touched" class="invalid-feedback">
                    Ultimo nome é obrigatorio
                 </div>     
            </div>
        </div>
        <div class="mb-3">
            <label for="">Email:</label>
            <input 
                type="text" 
                class="form-control" 
                formControlName="email"
                placeholder="Exemplo: Email@email.com"
                [ngClass]="{'is-invalid': f.email?.errors && f.email?.touched}" 
            />
            <div *ngIf="f.email?.errors?.required && f.email?.touched" class="invalid-feedback">
                Favor inserir Email
            </div>
            <div *ngIf="f.email?.errors?.email && f.email?.touched" class="invalid-feedback">
                Email inválido
            </div>
        </div>
        
        <div class="mb-3">
            <label for="">Usuario:</label>
            <input 
            type="text" 
            class="form-control" 
            formControlName="nomeUsuario"
            placeholder="user007"
            [ngClass]="{'is-invalid': f.nomeUsuario?.errors && f.nomeUsuario?.touched}"             
            />

        <div *ngIf="f.nomeUsuario?.errors?.required && f.nomeUsuario?.touched" class="invalid-feedback">
            Favor inserir Usuario
        </div>


        </div>
        <div class="row">
            <div class="col-sm-6 mb-3">
                <label for="">Senha:</label>
                <input 
                type="text" 
                class="form-control" 
                formControlName="senha"
                [ngClass]="{'is-invalid': f.senha?.errors && f.senha?.touched}"             
                />

        <div *ngIf="f.senha?.errors?.required && f.senha?.touched" class="invalid-feedback">
            Favor inserir a Senha
        </div>
            </div>
            <div class="col-sm-6 mb-3">
                <label for="">Confirmar Senha:</label>
                <input 
                type="text" 
                class="form-control" 
                formControlName="confirmarSenha"
                [ngClass]="{'is-invalid': f.confirmarSenha?.errors && f.confirmarSenha?.touched}"             
                />

        <div *ngIf="f.confirmarSenha?.errors?.required && f.confirmarSenha?.touched" class="invalid-feedback">
            Favor inserir Senha
        </div>
        <div *ngIf="f.confirmarSenha?.errors?.mustMatch && f.confirmarSenha?.touched" class="invalid-feedback">
            Senha não são iguais
        </div>
            </div>
        </div>
        <div class="row p-1 mb-3">
            <div class="custom-control custom-checkbox">
                <input type="checkbox" class="custom-control-input" id="customCheck1">
                <label class="custom-control-label">Eu concordo com os <a href="#">Termos de Uso</a>.</label>
            </div>
        </div>
        <div class="row">
            <div class="col-12 mb-3">
                <button class="btn btn-lg btn-success btn-block px-5" [disabled]="!form.valid">
                    Registar
                </button>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <a class="btn btn-link btn-block">
                    Já sou Cadastrado
                </a>
            </div>
        </div>
    </form>
</div>

 
</div>
